# [S08]: bioconda environment for the external tools used by the
# workflow, plus a Python interpreter for bin/*.py (standard library
# only — no pip dependencies). Used by the `conda` profile in
# nextflow.config.
#
# [S69]: every tool is pinned to an EXACT version (never a floating
# `>=`) so the byte-exact characterization tests stay reproducible, and
# these pins must match the versions the CI workflow installs
# (.github/workflows/test.yml). Bump deliberately, in both files at
# once.
#
# mumu is now distributed on bioconda, so the `conda` profile resolves it
# alongside the other tools instead of building it from source. Keep its
# pin in sync with the CI workflow (.github/workflows/test.yml), same as
# the others.
name: nf-metabarcoding
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::swarm=3.1.6
  - bioconda::vsearch=2.31.0
  - bioconda::cutadapt=5.2
  - bioconda::mumu=1.1.4
  - conda-forge::python=3.12
