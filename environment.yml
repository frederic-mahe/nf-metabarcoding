# [S08]: bioconda environment for the four external tools used by the
# workflow, plus a Python interpreter for bin/*.py (standard library
# only — no pip dependencies). Used by the `conda` profile in
# nextflow.config. vsearch and mumu carry explicit minimum versions
# (mumu >= 1.1.1 is required by SPECIFICATIONS; vsearch >= 2.31.0);
# swarm/cutadapt/python are pinned and should be bumped deliberately,
# not implicitly.
name: nf-metabarcoding
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::swarm=3.1.5
  - bioconda::vsearch>=2.31.0
  - bioconda::cutadapt=4.9
  - bioconda::mumu>=1.1.1
  - conda-forge::python=3.11
