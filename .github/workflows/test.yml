name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  nf-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Install nf-test
        run: |
          curl -fsSL https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/

      - name: Set up bioinformatics tools
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: nfmb
          create-args: >-
            -c bioconda -c conda-forge
            vsearch=2.31.0
            cutadapt=5.2
            swarm=3.1.7
            mumu=1.1.4

      - name: Generate test fixtures
        run: bash tests/data/generate.sh

      - name: Run nf-test (CI-tagged tests only; pending tests excluded)
        run: nf-test test --tag ci --verbose

  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit spec <-> test mapping
        run: bash tests/coverage-gate.sh

  config-checks:
    # [S08]/[S75]/[S87]: assert the container profiles, the site-config
    # override mechanism and the institutional cluster profiles resolve
    # correctly. Config resolution only — no engine, no container build,
    # and no scheduler are exercised here (those stay manual cluster smoke
    # tests), so no tool setup is needed, just Nextflow.
    #
    # Run on a PINNED 25.10.x as well as the latest stable: a cluster
    # config that ships a block-form `singularity { }` scope silently
    # loses `singularity.enabled` on Nextflow 25.10.x (the version most of
    # our sites run) but not on 26.x, so a single-(latest-)version check
    # would miss that regression. [S87]
    strategy:
      fail-fast: false
      matrix:
        nxf_ver: ['25.10.2', 'latest-stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.nxf_ver }}
      - name: Validate container profile wiring
        run: bash tests/check-container-profiles.sh
      - name: Validate site-config override wiring
        run: bash tests/check-site-config.sh
      - name: Validate slurm profile wiring
        run: bash tests/check-slurm-config.sh
      - name: Validate institutional cluster profile wiring
        run: bash tests/check-cluster-profiles.sh
      - name: Validate cleanup default
        run: bash tests/check-cleanup-default.sh
      - name: Validate offline / pre-built container path
        run: bash tests/check-offline-container.sh
      - name: Validate execution-report wiring
        run: bash tests/check-execution-reports.sh
      - name: Validate stub-run topology (no tools installed)
        run: bash tests/check-stub-run.sh
      - name: Validate demo profile wiring
        run: bash tests/check-demo-profile.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck on tracked shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats unit tests on bin/ helpers
        run: bats tests/bin/

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pytest and flake8
        run: python -m pip install --upgrade pip pytest flake8
      - name: Lint python sources
        run: |
          mapfile -t py_files < <(git ls-files '*.py')
          if [ "${#py_files[@]}" -gt 0 ]; then
            flake8 "${py_files[@]}"
          fi
      - name: Run pytest on bin/ helpers
        run: pytest
