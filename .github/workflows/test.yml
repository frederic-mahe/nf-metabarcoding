name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  nf-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Install nf-test
        run: |
          curl -fsSL https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/

      - name: Set up bioinformatics tools
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: nfmb
          create-args: >-
            -c bioconda -c conda-forge
            vsearch>=2.31
            cutadapt>=5
            swarm>=3

      - name: Install mumu (not on bioconda; requires gcc >= 11 or clang >= 17)
        run: |
          gcc --version
          git clone --branch v1.1.3 --depth 1 https://github.com/frederic-mahe/mumu.git "$RUNNER_TEMP/mumu"
          make -C "$RUNNER_TEMP/mumu"
          sudo install -m 0755 "$RUNNER_TEMP/mumu/mumu" /usr/local/bin/mumu
          mumu --version

      - name: Generate test fixtures
        run: bash tests/data/generate.sh

      - name: Run nf-test (CI-tagged tests only; pending tests excluded)
        run: nf-test test --tag ci --verbose

  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit spec <-> test mapping
        run: bash tests/coverage-gate.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck on tracked shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats unit tests on bin/ helpers
        run: bats tests/bin/

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pytest and flake8
        run: python -m pip install --upgrade pip pytest flake8
      - name: Lint python sources
        run: |
          mapfile -t py_files < <(git ls-files '*.py')
          if [ "${#py_files[@]}" -gt 0 ]; then
            flake8 "${py_files[@]}"
          fi
      - name: Run pytest on bin/ helpers
        run: pytest
